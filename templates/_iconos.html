{# Iconos de línea dibujados aquí mismo: la app no necesita internet.
   Los usan el menú y los botones Corregir / Borrar del historial. #}
{% macro icono(nombre) %}
  <svg class="icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    {% if nombre == "registrar" %}
      <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/>
    {% elif nombre == "historial" %}
      <path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/>
    {% elif nombre == "papelera" %}
      <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>
    {% elif nombre == "listas" %}
      <path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>
    {% elif nombre == "respaldo" %}
      <path d="M7 18a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.6 1.5A3.8 3.8 0 0 1 17.5 18"/><path d="M12 13v8M9 16l3-3 3 3"/>
    {% elif nombre == "corregir" %}
      {# Lápiz sobre un cuadrado abierto en la esquina #}
      <path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M17.5 3.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/>
    {% endif %}
  </svg>
{% endmacro %}
